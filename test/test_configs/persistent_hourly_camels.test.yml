  #- SRAD(W/m2)   #for daily data
  #- Tmax(C)      #for daily data
  #- Tmin(C)       #for daily data

target_variables:  ["qobs_cfs"]

static_attributes:
 - carbonate_rocks_frac
 - geol_porostiy
 - geol_permeability
 - sand_frac
 - silt_frac
 - clay_frac
 - elev_mean
