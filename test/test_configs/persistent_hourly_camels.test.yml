# --- Experiment cofigurations --------------------------------------------------------------------
train_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_507_copy_OWP.txt
validation_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_507_copy_OWP.txt
test_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_250_OWP.txt


run_dir: /home/mhshah1/runs/persistent_4basins_seq_sweep
experiment_name: persistent_4basins


train_start_date: '01/10/1990'
train_end_date: '30/09/2003'
validation_start_date: '01/10/2003'
validation_end_date: '30/09/2008'
test_start_date: '01/06/1986'
test_end_date: '30/11/1986'

seed: 111
device: cuda:1

# --- Validation configuration ---------------------------------------------------------------------
validate_every: 3
validate_n_random_basins: 
cache_validation_data: True
metrics:
  - NSE
  - KGE
  - Alpha-NSE
  - Beta-NSE

# --- Model configuration --------------------------------------------------------------------------
model: persistentlstm
#model: cudalstm
head: regression
output_activation: linear

hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.3

persistent_state: true
nan_handling_method: masked


# --- Evaluation warm-up -----------------------------------------------------------------
eval_warmup_steps: 336


optimizer: Adam
loss: MSE


  #0: 0.001
  #2: 0.0009
  #3: 0.0008
  #6: 0.0007
  #9: 0.0003
  #10: 0.0001
  #13: 0.00009
  #15: 0.00007
  #16: 0.00005
 # 18: 0.00003
#  20: 0.00001


learning_rate:
  0: 0.001
  2: 0.0009
  3: 0.0008
  6: 0.0007
  9: 0.0003
  12: 0.0001
  13: 0.00001
  #15: 0.00007
  #16: 0.00005
  #18: 0.00003
  #20: 0.00001


batch_size: 16
epochs: 50
clip_gradient_norm: 1

#seq_length: &SEQ 12
#predict_last_n: *SEQ

seq_length:
  15min: &SEQ 12

predict_last_n:
  15min: *SEQ

num_workers: 8
log_interval: 50
log_tensorboard: False
log_n_figures: 0
save_weights_every: 5
save_validation_results: False

# --- Data configurations --------------------------------------------------------------------------



#dataset: camels_us          #for daily data
dataset: hourly_camels_us
data_dir: /mnt/disk1/CAMELS_US/
forcings: nldas_hourly
#forcings: nldas          #for daily data
dataset: fifteenmin_camels_us


# NEW: run the whole experiment at 15-minute timestep
use_frequencies: ["15min"]

# NEW: tell the dataset where your TRUE 15-min discharge (target) lives
qobs_15min_dir: /mnt/disk1/CAMELS_US/15min


dynamic_inputs:
 #- convective_fraction
 #- longwave_radiation
 #- potential_energy
 #- potential_evaporation
 #- pressure
 - shortwave_radiation
 #- specific_humidity
 - temperature
 - total_precipitation
 #- wind_u
 #- wind_v
