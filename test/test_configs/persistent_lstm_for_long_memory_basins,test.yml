#seed: 999
device: cuda:1

# --- Validation configuration ---------------------------------------------------------------------
validate_every: 3
validate_n_random_basins: 500
cache_validation_data: True
metrics:
  - NSE
  - KGE
  - Alpha-NSE
  - Beta-NSE

# --- Model configuration --------------------------------------------------------------------------
model: persistentlstm
#model: cudalstm
head: regression
output_activation: linear

hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4

persistent_state: true
nan_handling_method: masked


# --- Evaluation warm-up -----------------------------------------------------------------
eval_warmup_steps: 60


optimizer: Adam
loss: MSE

learning_rate:

  0: 0.001
  12: 0.0001
  15: 0.00007
#learning_rate:
 # 0: 0.001
  #12: 0.0001
  #15: 0.00007

batch_size: 8
epochs: 30
clip_gradient_norm: 1

seq_length: &SEQ 2
predict_last_n: *SEQ

#seq_length:
 #15min: &SEQ 24

#predict_last_n:
  #15min: *SEQ

num_workers: 8
log_interval: 50
log_tensorboard: False
log_n_figures: 0
save_weights_every: 5
save_validation_results: False

